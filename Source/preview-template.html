<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C罗 · SIUUUU 桌宠预览</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0e13;color:#f3f5f4;font:15px 'Segoe UI','Microsoft YaHei',sans-serif}main{width:min(920px,96vw);padding:42px 36px;display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:center}.eyebrow{color:#c6ab6a;letter-spacing:.22em;font-size:12px;font-weight:700}.flag{display:inline-block;width:20px;height:12px;background:linear-gradient(90deg,#126247 40%,#c12736 40%);border-radius:2px;margin-right:10px}h1{font-size:48px;line-height:1.22;letter-spacing:-.04em;margin:18px 0}h1 em{font-style:italic;color:#eac77c}.intro{color:#929da7;line-height:1.9;max-width:330px}.tags{display:flex;gap:9px;margin-top:28px}.tags span{font-size:11px;border:1px solid #303842;padding:6px 10px;border-radius:99px;color:#b1bbc2}.stage{position:relative;width:360px;height:440px;border:1px solid #273139;border-radius:26px;background:radial-gradient(ellipse at 25% 70%,#1b302b66,transparent 65%),radial-gradient(ellipse at 80% 25%,#54202155,transparent 60%),#11181f;overflow:hidden}canvas{width:360px;height:440px;cursor:pointer;position:absolute;inset:0}.num{position:absolute;top:24px;right:26px;font-weight:900;font-size:94px;color:#ffffff05;line-height:1;pointer-events:none}.hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#8c9b9f;font-size:11px;pointer-events:none}.controls{display:flex;align-items:center;gap:14px;margin-top:18px}.play{border:0;background:#e7c580;color:#172019;padding:13px 22px;border-radius:10px;font-weight:700;cursor:pointer}.play:disabled{opacity:.55;cursor:default}.mute{border:0;background:none;color:#abb7bc;cursor:pointer;padding:8px}.volume{accent-color:#e7c580;width:90px}.status{font-size:12px;color:#90ad9e;margin-top:18px;height:20px}.track{height:3px;background:#252d34;border-radius:9px;margin-top:16px;overflow:hidden}.track i{display:block;width:0;height:100%;background:#e7c580}.footer{color:#58646c;font-size:11px;margin-top:34px}@media(max-width:720px){main{width:100%;grid-template-columns:1fr;padding:30px 12px;justify-items:center}.stage{max-width:100%;height:auto;aspect-ratio:360/440}canvas{width:100%;height:100%}.copy{width:360px;max-width:100%}h1{font-size:38px}.intro{max-width:none}.tags{margin-top:12px}.footer{margin-top:18px}}
</style>
<main><section class="copy"><div class="eyebrow"><span class="flag"></span>CR7 / PORTUGAL</div><h1>一跃。转身。<br><em>SIUUUU!</em></h1><p class="intro">你的桌面，C 罗的主场。<br>点击他，看 7 号起跳，听熟悉的庆祝。</p><div class="tags"><span>葡萄牙红</span><span>大头 C 罗</span><span>原声庆祝</span></div><div class="controls"><button class="play" id="play" disabled>正在准备…</button><button class="mute" id="mute" aria-label="切换静音">声音开</button><input class="volume" id="volume" type="range" min="0" max="100" value="65" aria-label="音量"></div><div class="status" id="status" aria-live="polite">准备人物素材</div><div class="track"><i id="progress"></i></div><p class="footer">桌宠效果预览 · 点击人物或按钮播放完整动作</p></section><div class="stage"><div class="num">7</div><canvas id="canvas" width="720" height="880" aria-label="点击 C 罗开始庆祝" role="button" tabindex="0"></canvas><div class="hint">点击，见证标志性的瞬间</div></div></main>
<script>
const spriteData=__SPRITES__,audioData='__AUDIO__';
const sprites=spriteData.map(src=>{const img=new Image();img.src=src;return img});
const audio=new Audio(audioData);audio.volume=.65;
const cv=document.getElementById('canvas'),ctx=cv.getContext('2d');ctx.scale(2,2);
const button=document.getElementById('play'),status=document.getElementById('status'),progress=document.getElementById('progress');
const times=[0,240,410,530,790,1050,1420,1600,2720,3010,3260,3500],poses=[0,1,1,2,3,4,5,6,6,7,0,0];
let running=false,start=0,landed=false,ready=false,muted=false;
function ease(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)}
function draw(ms,active){ctx.clearRect(0,0,360,440);let i=0;while(i<times.length-2&&ms>=times[i+1])i++;let blend=active?ease((ms-times[i+1]+85)/85):0,p=active?poses[i]:0,n=poses[i+1],lift=0,sx=1,sy=1;
if(active&&ms>=410&&ms<1420){let u=(ms-410)/1010;lift=82*4*u*(1-u)}
if(active&&ms>=1420&&ms<1600){let squash=Math.sin(Math.PI*(ms-1420)/180);sy=1-.045*squash;sx=1+.025*squash}
ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(180,412,55,5,0,0,Math.PI*2);ctx.fill();
let unit=300/560,w=512*unit,h=640*unit,x=(360-w)/2,y=410-616*unit-lift;
ctx.save();ctx.translate(180,410-lift);ctx.scale(sx,sy);ctx.translate(-180,-410+lift);ctx.globalAlpha=1-blend;ctx.drawImage(sprites[p],x,y,w,h);if(blend>0){ctx.globalAlpha=blend;ctx.drawImage(sprites[n],x,y,w,h)}ctx.restore();
if(active&&ms>=1420&&ms<=2720){ctx.save();ctx.globalAlpha=Math.min(1,(ms-1420)/110,(2720-ms)/160);ctx.font='italic 900 27px Segoe UI';ctx.textAlign='center';ctx.fillStyle='#111a22ed';ctx.beginPath();ctx.roundRect(90,45,180,43,14);ctx.fill();ctx.fillStyle='#ffdb70';ctx.fillText('SIUUUU!',180,76);ctx.restore()}}
function tick(now){const ms=Math.min(3500,now-start);draw(ms,true);progress.style.width=(ms/35)+'%';status.textContent=ms<410?'蓄力，准备起跳':ms<1420?'腾空转身':ms<2720?'RONALDO · 7 · SIUUUU!':'转回正面';if(!landed&&ms>=1420){landed=true;if(!muted){audio.currentTime=0;audio.play().catch(()=>{status.textContent='浏览器暂未允许播放声音，请再点击一次'})}}
if(ms<3500)requestAnimationFrame(tick);else{running=false;button.disabled=false;button.textContent='再来一次 ↗';status.textContent='准备好了，点击再庆祝一次';progress.style.width='0%';draw(0,false)}}
function celebrate(){if(!ready||running)return;running=true;landed=false;button.disabled=true;button.textContent='庆祝中…';audio.pause();audio.currentTime=0;const volume=audio.volume;audio.volume=0;audio.play().then(()=>{audio.pause();audio.currentTime=0;audio.volume=volume}).catch(()=>{audio.volume=volume});start=performance.now();requestAnimationFrame(tick)}
button.onclick=celebrate;cv.onclick=celebrate;cv.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();celebrate()}};
document.getElementById('mute').onclick=()=>{muted=!muted;audio.muted=muted;document.getElementById('mute').textContent=muted?'已静音':'声音开'};
document.getElementById('volume').oninput=e=>audio.volume=Number(e.target.value)/100;
Promise.all(sprites.map(i=>i.decode())).then(()=>{ready=true;button.disabled=false;button.textContent='点击，SIUUUU ↗';status.textContent='正面待机 · 点击开始';draw(0,false)}).catch(()=>status.textContent='素材载入失败，请重新打开预览');
</script></html>
